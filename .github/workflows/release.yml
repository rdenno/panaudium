name: Build and release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and attach assets to, e.g. v0.2.0"
        required: true
      ref:
        description: "Optional branch/commit to build from instead of the tag (e.g. main)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref }}

      - name: Configure (fetches JUCE 8.0.8)
        # No hard-coded generator: CMake picks the newest Visual Studio installed on the runner image.
        run: cmake -S . -B build -A x64

      - name: Build plugin, standalone and test tools
        run: cmake --build build --config Release --target Panaudium_VST3 Panaudium_Standalone panaudium_render panaudium_hosttest --parallel

      - name: FX torture test
        run: |
          New-Item -ItemType Directory -Force fxtest | Out-Null
          & build\Release\panaudium_render.exe fxtest --fxtest
          if ($LASTEXITCODE -ne 0) { Write-Warning "fxtest flagged settings (see log)" }

      - name: Headless host test (loads the VST3 like a DAW)
        run: |
          & build\panaudium_hosttest_artefacts\Release\panaudium_hosttest.exe build\Panaudium_artefacts\Release\VST3\Panaudium.vst3 hosttest --all-programs --no-perf
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: pluginval (strictness 5)
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # Out-of-process so a crash is reported rather than killing the step; generous timeout for slow runners.
          & pluginval\pluginval.exe --strictness-level 5 --timeout-ms 900000 --output-dir pluginval-logs --validate build\Panaudium_artefacts\Release\VST3\Panaudium.vst3
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            pluginval-logs/
            hosttest/
          if-no-files-found: ignore

      - name: Package installer and zip
        run: |
          choco install innosetup -y --no-progress
          $ver = $env:TAG.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver /DBuildDir=..\build installer\panaudium.iss
          New-Item -ItemType Directory -Force dist\zip | Out-Null
          Copy-Item -Recurse build\Panaudium_artefacts\Release\VST3\Panaudium.vst3 dist\zip\
          Copy-Item build\Panaudium_artefacts\Release\Standalone\Panaudium.exe dist\zip\
          Copy-Item LICENSE, README.md dist\zip\
          Compress-Archive -Path dist\zip\* -DestinationPath "dist\Panaudium-$ver-Windows-x64.zip" -Force

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-ChildItem dist\*.exe, dist\*.zip | ForEach-Object { $_.FullName }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:TAG @assets --clobber }
          else { gh release create $env:TAG @assets --title "Panaudium $env:TAG" --notes "Automated Windows build. See README for details." }
